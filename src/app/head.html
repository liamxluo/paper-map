<script>/* the desk opens first: keep the app out of sight until it is up */
(function(){ try{ var q = location.search, h = location.hash; if(h.length > 1 || /[?&](add|title)=/.test(q)) return; var s = JSON.parse(localStorage.getItem('rl:settings') || 'null'); var example = /^https?:$/.test(location.protocol) && !/[?&](app|add|title)\b/.test(q); if(example || !(s && s.desk && s.desk.start === 'map')){ document.documentElement.classList.add('desk-boot'); setTimeout(function(){ document.documentElement.classList.remove('desk-boot'); }, 5000); } }catch(e){} })();</script>
<style>html.desk-boot,html.desk-boot body{background:#120604}html.desk-boot body > *:not(#pmDesk){visibility:hidden}</style>

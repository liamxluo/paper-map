# Makes Paper Map for Mac (one app for Apple silicon and Intel) and attaches it to a release:
# with its version in the name, and as Paper-Map.dmg, which the README's "Download for macOS" link points at.
# It runs by itself when you publish a release, or by hand: Actions → Mac app → Run workflow → the release's tag.
name: Mac app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to attach the app to (its tag, for example v3.1.0)"
        required: true
        default: "v3.1.0"

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm install
      - name: Make the download window sharp on Retina screens
        run: tiffutil -cathidpicheck src-tauri/dmg/background.png src-tauri/dmg/background@2x.png -out src-tauri/dmg/background.tiff || true
      - name: Make the app and its .dmg
        run: |
          # first with the drag-to-Applications window laid out; if the runner cannot do that, a plain .dmg
          CI=false npm run tauri build -- --target universal-apple-darwin --bundles dmg || npm run tauri build -- --target universal-apple-darwin --bundles dmg
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$DMG" Paper-Map.dmg
          gh release upload "$TAG" "$DMG" Paper-Map.dmg --clobber

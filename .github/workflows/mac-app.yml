# Makes Paper Map for Mac (one app for Apple silicon and Intel) and attaches it to a release:
# with its version in the name, as Paper-Map.dmg (the README's "Download for macOS" link points at it),
# and, when the signing key is set up, as a signed update (Paper-Map.app.tar.gz + latest.json) that apps already
# installed find by themselves and install in place.
# It runs by itself when you publish a release, or by hand: Actions → Mac app → Run workflow → the release's tag.
name: Mac app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to attach the app to (its tag, for example v3.1.3)"
        required: true
        default: "v3.1.3"

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # keep what Rust has already compiled between releases, so the build does not start from nothing each time
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm install
      - name: Make the download window sharp on Retina screens
        run: tiffutil -cathidpicheck src-tauri/dmg/background.png src-tauri/dmg/background@2x.png -out src-tauri/dmg/background.tiff || true
      # signs the app with your own certificate, the same one every time, so the Mac knows each new version as the same app
      # (the keychain then keeps its "Always Allow" across updates). Without the secrets, or if anything here fails, the app
      # is made exactly as before.
      - name: Use your signing certificate, when there is one
        continue-on-error: true
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CERT_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$CERT" ] || [ -z "$CERT_ID" ]; then echo "No signing certificate: the app is made as before."; exit 0; fi
          set -e
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KC="$RUNNER_TEMP/build.keychain"
          security create-keychain -p pm "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p pm "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k pm "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "$CERT_ID" -p "$KC" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          security find-identity -v -p codesigning "$KC"
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Make the app, its .dmg and its signed update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # without the signing key the app is still made, only without the files it updates itself from
          EXTRA=""
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            EXTRA='--config {"bundle":{"createUpdaterArtifacts":false}}'
            echo "::warning::The TAURI_SIGNING_PRIVATE_KEY secret is not set: this release has no self-update files."
          fi
          # first with the drag-to-Applications window laid out; if the runner cannot do that, a plain .dmg
          CI=false npm run tauri build -- --target universal-apple-darwin --bundles app,dmg $EXTRA || npm run tauri build -- --target universal-apple-darwin --bundles app,dmg $EXTRA
      - name: Attach it to the release, with the update for apps already installed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          B=src-tauri/target/universal-apple-darwin/release/bundle
          DMG=$(ls $B/dmg/*.dmg | head -1)
          cp "$DMG" Paper-Map.dmg
          FILES=("$DMG" Paper-Map.dmg)
          TGZ=$(ls $B/macos/*.app.tar.gz 2>/dev/null | head -1 || true)
          if [ -n "$TGZ" ] && [ -f "$TGZ.sig" ]; then
            cp "$TGZ" Paper-Map.app.tar.gz
            export VERSION="${TAG#v}" SIG="$(cat "$TGZ.sig")" URL="https://github.com/$REPO/releases/download/$TAG/Paper-Map.app.tar.gz"
            export NOTES="$(gh release view "$TAG" --json body -q .body 2>/dev/null || true)"
            python3 -c 'import json, os, datetime
          p = {"signature": os.environ["SIG"], "url": os.environ["URL"]}
          print(json.dumps({"version": os.environ["VERSION"], "notes": os.environ.get("NOTES", ""), "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "platforms": {"darwin-aarch64": p, "darwin-x86_64": p, "darwin-universal": p}}, indent=1))' > latest.json
            FILES+=(Paper-Map.app.tar.gz latest.json)
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber

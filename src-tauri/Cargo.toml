[package]
name = "paper-map"
version = "3.0.1"
description = "A personal map of research, ideas and reading"
authors = ["liamxluo"]
license = "MIT"
repository = "https://github.com/liamxluo/paper-map"
edition = "2021"

[lib]
name = "paper_map_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

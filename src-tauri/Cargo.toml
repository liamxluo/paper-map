[package]
name = "paper-map"
version = "3.1.5"
description = "A personal map of research, ideas and reading"
authors = ["liamxluo"]
license = "Apache-2.0"
repository = "https://github.com/liamxluo/paper-map"
edition = "2021"

[lib]
name = "paper_map_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Paper Map updates itself from GitHub Releases
tauri-plugin-updater = "2"
# the GitHub token is kept in the macOS Keychain
keyring = { version = "3", features = ["apple-native"] }

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="150" viewBox="0 0 640 150" role="img" aria-label="Structure: topics inside topics, to any depth. Connect: lines between papers and topics. Explore: a field laid out over time." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .t{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
    .c{font:400 15.5px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#7d8590}
    .i{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .k{fill:none;stroke:#8b949e;stroke-width:1.4;opacity:.55;stroke-linecap:round}
  </style>
  <!-- the three are joined like papers on the map: a solid line, then a dotted one -->
  <path class="k" d="M17 42V58"/>
  <path class="k" d="M17 92V108" stroke-dasharray="0.5 4"/>
  <!-- Structure -->
  <g class="i" stroke="#B7791F" transform="translate(4 12) scale(1.083)"><path d="M6 3v12.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M18 8.5c0 5-6.5 5.5-10.3 8.2"/></g>
  <text class="t" x="48" y="31" fill="#B7791F">Structure</text>
  <text class="c" x="150" y="31">Topics inside topics, to any depth</text>
  <!-- Connect -->
  <g class="i" stroke="#2F74B5" transform="translate(4 62) scale(1.083)"><circle cx="12" cy="4.5" r="2.5"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/><path d="M12 7v4.5M12 11.5H5.5V16M12 11.5h6.5V16"/></g>
  <text class="t" x="48" y="81" fill="#2F74B5">Connect</text>
  <text class="c" x="150" y="81">Lines between papers and topics</text>
  <!-- Explore -->
  <g class="i" stroke="#1F8A66" transform="translate(4 112) scale(1.083)"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>
  <text class="t" x="48" y="131" fill="#1F8A66">Explore</text>
  <text class="c" x="150" y="131">A field laid out over time</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

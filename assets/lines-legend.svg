<svg xmlns="http://www.w3.org/2000/svg" width="640" height="212" viewBox="0 0 640 212" role="img" aria-label="Builds on: a solid line, it uses the other paper's ideas. Responds to: a dashed line, it argues with, tests or corrects it. Related to: a dotted line, connected some other way. Needs: long dashes from a square, a concept to know first, shown when you select the paper. Related topics: an arc beside two rows, two topics that belong together. Every line can carry a short note." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .t{font:600 15.5px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#6e7781}
    .c{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#7d8590}
    .n{font:italic 400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#7d8590}
    .l{fill:none;stroke:#768390;stroke-width:1.7}
  </style>
  <!-- Builds on: solid -->
  <path class="l" d="M17 22H71"/><circle cx="12" cy="22" r="5" fill="#7058A3"/><circle cx="76" cy="22" r="5" fill="#2A9D78"/>
  <text class="t" x="104" y="27">Builds on</text><text class="c" x="226" y="27">uses its ideas</text>
  <!-- Responds to: dashed -->
  <path class="l" d="M17 58H71" stroke-dasharray="4 3"/><circle cx="12" cy="58" r="5" fill="#7058A3"/><circle cx="76" cy="58" r="5" fill="#2A9D78"/>
  <text class="t" x="104" y="63">Responds to</text><text class="c" x="226" y="63">argues with, tests or corrects it</text>
  <!-- Related to: dotted -->
  <path class="l" d="M17 94H71" stroke-dasharray="1 4" stroke-linecap="round" stroke-width="2"/><circle cx="12" cy="94" r="5" fill="#7058A3"/><circle cx="76" cy="94" r="5" fill="#2A9D78"/>
  <text class="t" x="104" y="99">Related to</text><text class="c" x="226" y="99">connected some other way</text>
  <!-- Needs: long dashes from a concept square -->
  <path class="l" d="M17 130H71" stroke-dasharray="7 3" stroke-width="1.4"/><rect x="7" y="125" width="10" height="10" rx="1.5" fill="none" stroke="#768390" stroke-width="1.8"/><circle cx="76" cy="130" r="5" fill="#2A9D78"/>
  <text class="t" x="104" y="135">Needs</text><text class="c" x="226" y="135">a concept to know first, shown when you select</text>
  <!-- Related topics: an arc beside two rows -->
  <rect x="24" y="157" width="52" height="8" rx="3" fill="#8b949e" opacity=".35"/><rect x="24" y="173" width="52" height="8" rx="3" fill="#8b949e" opacity=".35"/>
  <path d="M20 161C10 161 10 177 20 177" fill="none" stroke="#3B82C4" stroke-width="1.6"/><circle cx="20" cy="161" r="2.3" fill="#3B82C4"/><circle cx="20" cy="177" r="2.3" fill="#3B82C4"/>
  <text class="t" x="104" y="174">Related topics</text><text class="c" x="226" y="174">two topics that belong together</text>
  <text class="n" x="104" y="205">Every line can carry a short note, like “fuelled by”.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

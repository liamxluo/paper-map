<svg xmlns="http://www.w3.org/2000/svg" width="640" height="212" viewBox="0 0 640 212" role="img" aria-label="Builds on: a solid line, it uses the other paper's ideas; arrows point to the later paper. Responds to: a dashed line, it argues with, tests or corrects it. Related to: a dotted line, connected some other way. Mentions: a faint shadow of the dot in another field's row. Related topics: marked with a two-way arrow, and one lights up while you are in the other. Every line can carry a short note." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .t{font:600 15.5px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#6e7781}
    .c{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#7d8590}
    .n{font:italic 400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#7d8590}
    .l{fill:none;stroke:#768390;stroke-width:1.7}
  </style>
  <!-- Builds on: solid -->
  <path class="l" d="M17 22H71"/><path d="M41 17.5L47 22L41 26.5" fill="none" stroke="#768390" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="22" r="5" fill="#7058A3"/><circle cx="76" cy="22" r="5" fill="#2A9D78"/>
  <text class="t" x="104" y="27">Builds on</text><text class="c" x="226" y="27">uses its ideas</text>
  <!-- Responds to: dashed -->
  <path class="l" d="M17 58H71" stroke-dasharray="4 3"/><path d="M41 53.5L47 58L41 62.5" fill="none" stroke="#768390" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="58" r="5" fill="#7058A3"/><circle cx="76" cy="58" r="5" fill="#2A9D78"/>
  <text class="t" x="104" y="63">Responds to</text><text class="c" x="226" y="63">argues with, tests or corrects it</text>
  <!-- Related to: dotted -->
  <path class="l" d="M17 94H71" stroke-dasharray="1 4" stroke-linecap="round" stroke-width="2"/><circle cx="12" cy="94" r="5" fill="#7058A3"/><circle cx="76" cy="94" r="5" fill="#2A9D78"/>
  <text class="t" x="104" y="99">Related to</text><text class="c" x="226" y="99">connected some other way</text>
  <!-- Mentions: a faint shadow dot in another field's row, joined by a dashed drop line when lit -->
  <circle cx="20" cy="122" r="5" fill="#2A9D78"/><path d="M20 127V133" stroke="#6F7888" stroke-width="1.2" stroke-dasharray="2 3"/><circle cx="20" cy="140" r="6.4" fill="none" stroke="#A3ABB8" stroke-width="1" stroke-dasharray="1.2 2.2" stroke-linecap="round"/><circle cx="20" cy="140" r="3.8" fill="#A3ABB8"/>
  <text class="t" x="104" y="135">Mentions</text><text class="c" x="226" y="135">a grey shadow in another field it mentions</text>
  
<!-- Related topics: marked ⇄, and the other one lights up while you are in one -->
  <rect x="6" y="153" width="74" height="12" rx="3" fill="#8b949e" opacity=".22"/><text x="70" y="163" font-size="11" fill="#3B82C4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">⇄</text>
  <rect x="6" y="169" width="74" height="12" rx="3" fill="#3B82C4" opacity=".18"/><rect x="6" y="169" width="2.6" height="12" fill="#3B82C4"/><text x="70" y="179" font-size="11" fill="#3B82C4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">⇄</text>
  <text class="t" x="104" y="174">Related topics</text><text class="c" x="226" y="174">marked ⇄; one lights up while you’re in the other</text>
  <text class="n" x="104" y="205">Every line can carry a short note, like “uses it”.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
